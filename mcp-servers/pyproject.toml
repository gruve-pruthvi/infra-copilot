[project]
name = "infra-copilot-mcp-servers"
version = "0.1.0"
description = "MCP stdio tool servers for infra-copilot (docker, k8s, monitoring)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "docker>=7.1",
    "kubernetes>=31.0",
    "psutil>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docker_tools", "k8s_tools", "monitoring_tools"]
