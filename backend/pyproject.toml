[project]
name = "infra-copilot-backend"
version = "0.1.0"
description = "infra-copilot FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "pydantic-ai>=1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "docker>=7.1",
    "kubernetes>=31.0",
    "psutil>=6.0",
    "httpx>=0.27",
    "infra-copilot-mcp-servers",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
infra-copilot-mcp-servers = { path = "../mcp-servers", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
